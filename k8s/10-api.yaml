apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: api
          image: orders-app:1.0
          imagePullPolicy: IfNotPresent   # image is built locally, not pulled
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: mysql-credentials, key: MYSQL_DATABASE } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: mysql-credentials, key: MYSQL_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-credentials, key: MYSQL_PASSWORD } }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: orders
spec:
  type: NodePort          # reachable at http://localhost:30080 on Docker Desktop
  selector:
    app: orders-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
